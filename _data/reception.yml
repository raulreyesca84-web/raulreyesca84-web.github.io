- id: lovuolo-2026
  category: research
  featured: true
  citation_es: 'Santiago Lo Vuolo, “Entre historia y estructura: la noción de problema en Althusser”, <em>Praxis Filosófica</em>,
    núm. 63, 2026, p. 16, nota 7. Cita “La antifilosofía de Marx”.'
  citation_en: 'Santiago Lo Vuolo, “Entre historia y estructura: la noción de problema en Althusser,” <em>Praxis Filosófica</em>,
    no. 63, 2026, p. 16, n. 7. Cites “La antifilosofía de Marx”.'
  citation_fr: 'Santiago Lo Vuolo, « Entre historia y estructura: la noción de problema en Althusser », <em>Praxis Filosófica</em>,
    no 63, 2026, p. 16, note 7. Cite « La antifilosofía de Marx ».'
  featured_es: <strong>Recepción conceptual · Marx y Althusser.</strong> Santiago Lo Vuolo cita “La antifilosofía de Marx”
    y retoma expresamente la interpretación según la cual la dialéctica hegeliana no desaparece en Marx, sino que adquiere
    un carácter antifilosófico.
  featured_en: <strong>Conceptual reception · Marx and Althusser.</strong> Santiago Lo Vuolo cites “La antifilosofía de Marx”
    and explicitly takes up the interpretation according to which the Hegelian dialectic does not disappear in Marx but acquires
    an antiphilosophical character.
  featured_fr: <strong>Réception conceptuelle · Marx et Althusser.</strong> Santiago Lo Vuolo cite « La antifilosofía de Marx
    » et reprend explicitement l’interprétation selon laquelle la dialectique hégélienne ne disparaît pas chez Marx, mais
    acquiert un caractère antiphilosophique.
  url: https://praxisfilosofica.univalle.edu.co/index.php/praxis/article/view/14761
  source_kind: primary-fulltext
  verification_note: Página oficial del artículo.
