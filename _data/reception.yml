- id: toledo-2022
  category: research
  featured: true
  citation_es: 'Stefany Jesús Toledo Suazo, <em>Poéticas de la memoria traumática y del cuerpo desaparecido: Reconstrucción
    crítica del panorama teatral post-golpe (1974-1990) y sus huellas en la concepción y práctica del cuerpo del actor contemporáneo</em>,
    tesis de Licenciatura en Teatro, Universidad Academia de Humanismo Cristiano, Santiago de Chile, 2022, p. 10. Cita “El
    acontecimiento político en la obra de Alain Badiou. Una reflexión a partir de los acontecimientos de la Revolución Francesa”.'
  citation_en: 'Stefany Jesús Toledo Suazo, <em>Poéticas de la memoria traumática y del cuerpo desaparecido: Reconstrucción
    crítica del panorama teatral post-golpe (1974-1990) y sus huellas en la concepción y práctica del cuerpo del actor contemporáneo</em>,
    undergraduate thesis in Theatre, Universidad Academia de Humanismo Cristiano, Santiago de Chile, 2022, p. 10. Cites “El
    acontecimiento político en la obra de Alain Badiou. Una reflexión a partir de los acontecimientos de la Revolución Francesa”.'
  citation_fr: 'Stefany Jesús Toledo Suazo, <em>Poéticas de la memoria traumática y del cuerpo desaparecido: Reconstrucción
    crítica del panorama teatral post-golpe (1974-1990) y sus huellas en la concepción y práctica del cuerpo del actor contemporáneo</em>,
    mémoire de licence en théâtre, Universidad Academia de Humanismo Cristiano, Santiago du Chili, 2022, p. 10. Cite « El
    acontecimiento político en la obra de Alain Badiou. Una reflexión a partir de los acontecimientos de la Revolución Francesa
    ».'
  featured_es: <strong>Recepción conceptual · interdisciplinaria.</strong> Toledo Suazo incorpora la conceptualización del
    acontecimiento político desarrollada por Raúl Reyes Camargo a partir de Alain Badiou para analizar el golpe de Estado
    chileno, articulando acontecimiento, subversión, memoria y teatro.
  featured_en: <strong>Conceptual reception · interdisciplinary.</strong> Toledo Suazo draws on Raúl Reyes Camargo’s conceptualization
    of the political event through Alain Badiou to analyze the Chilean coup d’état, connecting event, subversion, memory,
    and theatre.
  featured_fr: <strong>Réception conceptuelle · interdisciplinaire.</strong> Toledo Suazo mobilise la conceptualisation de
    l’événement politique développée par Raúl Reyes Camargo à partir d’Alain Badiou pour analyser le coup d’État chilien,
    en articulant événement, subversion, mémoire et théâtre.
  url: https://bibliotecadigital.academia.cl/handle/123456789/7440
  source_kind: official-repository
  verification_note: Registro persistente de la tesis; la cita sustantiva fue verificada en el PDF.
